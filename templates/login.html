{% extends 'base.html' %}

{% block navbar %}
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">V-Park</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="{{ url_for('about') }}">About Us</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="{{ url_for('features') }}">Features</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="{{ url_for('services') }}">Services</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled" aria-disabled="true">Stats</a>
                        <!-- <a class="nav-link active" aria-current="page" href="{{ url_for('stats') }}">Stats</a> -->
                    </li>
                </ul>
            </div>
        </div>
    </nav>
{% endblock %}

{% block content %}
<div class="contents">
    <div class="form">
        <form method="post">
        <br>
        <div class="mb-3">
            <label for="inputname" class="col-sm-2 col-form-label fw-bold text-dark">Username</label>
            <div class="col-sm-10">
            <input type="text" class="form-control" id="inputname" name="username">
            </div>
        </div>
        <br>
        <div class="mb-3">
            <label for="inputPassword" class="col-sm-2 col-form-label fw-bold text-dark">Password</label>
            <div class="col-sm-10">
            <input type="password" class="form-control" id="inputPassword" name="password">
            </div>
        </div>
        <br>
        <button type="submit" class="btn btn-primary">Sign in</button>
        </form>
    </div>
    <div class="register-link">
        <a href="{{ url_for('register') }}">New User? Register Here.</a>
    </div>
</div>
{% endblock %}
