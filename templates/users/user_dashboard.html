{% extends 'base.html' %}

{% block navbar %}
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">V-Park</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="{{ url_for('user_bp.user_dashboard', user_id=current_user.id) }}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="{{ url_for('user_bp.edit_user_profile', user_id=current_user.id) }}">Edit Profile</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled" aria-current="page" href="">Summary</a>
                    </li>
                </ul>
                <form class="d-flex align-items-center" role="search" method="GET" action="{{ url_for('main_bp.search') }}">
                    <label for="field" class="form-label me-2">Filter</label>
                        <select id="field" name="field" class="form-select me-2">
                        <option value="">None</option>
                        <option value="parking_lot">Parking Lot</option>
                        <option value="reservation">Reservation</option>
                        </select>
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" name="query"/>
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
                <li class="nav-item">
                    <a class="btn btn-outline-primary" href="{{ url_for('auth_bp.logout') }}">Log Out</a>
                </li>
            </div>
        </div>
    </nav>
{% endblock %}

{% block contents %}
    <div class="container">
        <h1>Welcome {{ current_user.username }}</h1>
    </div>
    
{% endblock %}
