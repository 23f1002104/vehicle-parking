{% extends 'base.html' %}

{% block navbar %}
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('user_bp.user_dashboard', user_id=current_user.id) }}"> Home </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>
{% endblock %}

{% block contents %}
    <div class="container mt-5">
        <form class="row g-3" method="post" action="{{ url_for('user_bp.reserve_spot', user_id=current_user.id, lot_id=lot.id) }}">
            <br>
            <div class="col-md-6">
                <label for="inputlotid" class="form-label fw-bold text-dark">Lot Id</label>
                <input type="text" class="form-control" id="inputlotid" name="lot_id" value="{{ lot.id }}" readonly>
            </div>
            <br>
            <div class="col-md-6">
                <label for="inputlotaddress" class="form-label fw-bold text-dark">Lot Address</label>
                <input type="text" class="form-control" id="inputlotaddress" name="lot_address" value="{{ lot.prime_location_name }}" readonly>
            </div>
            <br>
            <div class="col-md-6">
                <label for="inputusername" class="form-label fw-bold text-dark">Username</label>
                <input type="text" class="form-control" id="inputusername" name="username" value="{{ current_user.username }}" readonly>
            </div>
            <br>
            <div class="col-md-6">
                <label for="inputspotid" class="form-label fw-bold text-dark">Spot Id</label>
                <input type="text" class="form-control" id="inputspotid" name="spot_id" value="{{ spot.id }}" readonly>
            </div>
            <br>
            <div class="col-md-6">
                <label for="inputcost" class="form-label fw-bold text-dark">Spot Id</label>
                <input type="text" class="form-control" id="inputcost" name="price_per_hour" value="{{ lot.price_per_hour }}" readonly>
            </div>
            <br>
            <div class="col-md-6">
                <label for="inputcarno" class="form-label fw-bold text-dark">Vehicle No</label>
                <input type="text" class="form-control" id="inputcarno" name="car_id" required>
            </div>
            <br>
            <div class="col-12">
                <button type="submit" class="btn btn-primary">Reserve</button>
                <a href="{{ url_for('user_bp.user_dashboard', user_id=current_user.id) }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
{% endblock %}
