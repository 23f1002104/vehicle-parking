            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="{{ url_for('main_bp.about') }}">About Us</a>

{% block contents %}
    <div class="container mt-5">
        <form class="row g-3" method="post" action="{{ url_for('auth_bp.register') }}">
            <br>
            <div class="col-md-6">
                <label for="inputfullname" class="form-label fw-bold text-dark">Full Name</label>
                <input type="text" class="form-control" id="inputfullname" name="fullname">
            </div>
            <br>
            <div class="col-md-6">
                <label for="inputname" class="form-label fw-bold text-dark">Username</label>
                <input type="text" class="form-control" id="inputname" name="username">
            </div>
            <br>
            <div class="col-md-6">
                <label for="inputEmail" class="form-label fw-bold text-dark">Email</label>
                <input type="email" class="form-control" id="inputEmail" name="email">
            </div>
            <br>
            <div class="col-md-6">
                <label for="inputPassword" class="form-label fw-bold text-dark">Password</label>
                <input type="password" class="form-control" id="inputPassword" name="password">
            </div>
            <br>
            <!-- <div class="col-md-6">
                <label for="inputConfPassword" class="form-label fw-bold text-dark">Confirm Password</label>
                <input type="password" class="form-control" id="inputConfPassword" name="confpassword">
            </div>
            <br> -->
            <div class="col-12">
                <button type="submit" class="btn btn-primary">Register</button>
            </div>
        </form>
        <br>
        <div class="login-link text-center">
            <p class="text-muted">Already have an account? <a href="{{ url_for('auth_bp.login') }}">Login here</a></p>
        </div>        
    </div>

{% endblock %}
