{% extends 'base.html' %}   


{% block navbar %}
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">V-Park</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="{{ url_for('admin_bp.admin_dashboard', admin_id=current_user.id) }}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="{{ url_for('admin_bp.user_list', admin_id=current_user.id) }}">Users</a>
                    </li>
                    <li class="nav-item">
                        <!-- ! make the link active when `summary` is created -->
                        <a class="nav-link active" aria-current="page" href="{{ url_for('admin_bp.admin_summary', admin_id=current_user.id) }}">Summary</a>
                    </li>
                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>
{% endblock %}


{% block contents %}
    <div class="content">
        <h1>Edit Parking Lot #{{ parking_lot.id }}</h1>

        <form method="POST" action="{{ url_for('admin_bp.edit_parking_lot', admin_id=current_user.id, lot_id=parking_lot.id) }}">
            <div class="mb-3">
                <label for="price_per_hour" class="form-label">Price per hour</label>
                <input type="number" class="form-control" id="price_per_hour" name="price_per_hour" value="{{ parking_lot.price_per_hour }}" required>
            </div>
            <div class="mb-3">
                <label for="prime_location_name" class="form-label">Prime Location Name</label>
                <input type="text" class="form-control" id="prime_location_name" name="prime_location_name" value="{{ parking_lot.prime_location_name }}" required>
            </div>
            <div class="mb-3">
                <label for="address" class="form-label">Address</label>
                <input type="text" class="form-control" id="address" name="address" value="{{ parking_lot.address }}" required>
            </div>
            <div class="mb-3">
                <label for="pin_code" class="form-label">Pin Code</label>
                <input type="text" class="form-control" id="pin_code" name="pin_code" value="{{ parking_lot.pin_code }}" required>
            </div>
            <button type="submit" class="btn btn-success">Update Parking Lot</button>
        </form>
    </div>
{% endblock %}
